<!-- D-02 · Thành viên: bộ lọc + vùng bảng (bảng render động bằng d-02-table) -->
<div class="card"><div class="card-body">
  <div class="table-toolbar">
    <div class="field field-search"><label class="field-label" for="u-q">Tìm kiếm</label><input class="input" id="u-q" placeholder="Tên, SĐT, ref_code, alias" value="{{ f.q }}" oninput="Admin.st.users.q=this.value; Admin.st.users.page=1; Admin.renderUsers()"></div>
    <div class="field"><label class="field-label" for="u-type">Loại</label><select class="select" id="u-type" onchange="Admin.st.users.type=this.value; Admin.st.users.page=1; Admin.renderUsers()"><option value="">Tất cả</option><option value="agent" {{ f.type === 'agent' ? 'selected' : '' }}>Thành viên</option><option value="buyer" {{ f.type === 'buyer' ? 'selected' : '' }}>Người mua chưa đăng ký</option></select></div>
    <div class="field"><label class="field-label" for="u-rank">Hạng</label><select class="select" id="u-rank" onchange="Admin.st.users.rank=this.value; Admin.st.users.page=1; Admin.renderUsers()"><option value="">Tất cả</option>{% each r in CONFIG.ranks %}<option value="{{ r.id }}" {{ f.rank === r.id ? 'selected' : '' }}>{{{ r.label }}}</option>{% endeach %}</select></div>
    <div class="field"><label class="field-label" for="u-status">Trạng thái</label><select class="select" id="u-status" onchange="Admin.st.users.status=this.value; Admin.st.users.page=1; Admin.renderUsers()"><option value="">Tất cả</option><option value="active" {{ f.status === 'active' ? 'selected' : '' }}>Đang hoạt động</option><option value="locked" {{ f.status === 'locked' ? 'selected' : '' }}>Đã khoá</option></select></div>
    <div class="toolbar-actions"><button class="btn btn-secondary" onclick="Admin.exportUsers()">{{{ icon('download', 16) }}} Xuất Excel</button></div>
  </div>
  <div id="u-table">{{{ UI.skeletonTable(9, 6) }}}</div>
</div></div>
