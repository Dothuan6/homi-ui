<!-- Thanh 3 bước rút tiền: Số tiền → Tài khoản → Đã gửi — data: steps [{ k, l, active, done }] -->
<div class="steps mb-4">
  {% each s, i in steps %}
  <div class="step {{ s.active ? 'is-active' : '' }} {{ s.done ? 'is-done' : '' }}"><span class="step-dot">{% if s.done %}{{{ icon('check', 14) }}}{% else %}{{ i + 1 }}{% endif %}</span><span>{{ s.l }}</span></div>{% if i < 2 %}<span class="step-line"></span>{% endif %}
  {% endeach %}
</div>
