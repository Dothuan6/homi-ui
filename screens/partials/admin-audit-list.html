<!-- Danh sách audit của một thực thể: list = Store.auditOf(entity, id) -->
{% if list.length %}
<ul class="timeline">
  {% each a in list %}
  <li><span class="timeline-time">{{ dt(a.at) }}</span><span class="timeline-text"><strong>{{ a.actor }}</strong> {% if a.from || a.to %}<span class="mono">{{ a.from || '—' }} → {{ a.to || '—' }}</span> {% endif %}{{ a.note || '' }}</span></li>
  {% endeach %}
</ul>
{% else %}
<p class="text-muted">Chưa có</p>
{% endif %}
