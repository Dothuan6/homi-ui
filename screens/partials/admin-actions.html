<!-- Nút hành động góc phải topbar admin, theo màn (screen = 'D-02' | 'D-04' | 'D-05' | 'D-10') -->
{% if screen === 'D-02' %}
<button class="btn btn-primary" onclick="Admin.rootAgentModal()">{{{ icon('plus', 16) }}} Tạo thành viên gốc</button>
{% elif screen === 'D-04' %}
<button class="btn btn-primary" onclick="Admin.packageForm()">{{{ icon('plus', 16) }}} Thêm gói</button>
{% elif screen === 'D-05' %}
<button class="btn btn-secondary" onclick="Admin.importModal()">{{{ icon('upload', 16) }}} Nhập file</button>
<button class="btn btn-primary" onclick="Admin.generateModal()">{{{ icon('plus', 16) }}} Sinh hàng loạt</button>
{% elif screen === 'D-10' %}
<button class="btn btn-primary" onclick="Admin.adminForm()">{{{ icon('plus', 16) }}} Thêm tài khoản</button>
{% endif %}
