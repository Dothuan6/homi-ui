<!-- Không đủ điều kiện đăng ký (chưa mua / người giới thiệu Copper / bị từ chối / đã là thành viên) -->
<div class="card"><div class="card-body stack text-center">
  <div class="result-icon {{ iconClass }}" style="margin:0 auto">{{{ icon(ico, 34) }}}</div>
  <h2>{{ title }}</h2>
  <p class="text-muted">{{{ desc }}}</p>
  {% if agent %}
  <div class="actions"><a class="btn btn-primary btn-lg" href="#A-05">Đăng nhập</a></div>
  {% else %}
  <div class="actions actions-row">
    <a class="btn btn-secondary btn-lg" href="#A-06">Dùng số khác</a>
    <a class="btn btn-primary btn-lg" href="#A-04?phone={{ phone }}">Tra cứu đơn hàng</a>
  </div>
  {% endif %}
</div></div>
