<!-- (c) Khối VietQR + "Tôi đã chuyển khoản" -->
<div class="card">
  <div class="card-head"><h2>Chuyển khoản VietQR</h2><span class="text-sm text-muted">Bước 3/3</span></div>
  <div class="card-body stack">
    {{{ UI.vietqr(order) }}}
    <div class="alert alert-warning">{{{ icon('warning', 20) }}}<div>Nội dung chuyển khoản phải ghi <strong class="mono">{{ order.id }}</strong> để hệ thống đối soát đúng đơn. Chuyển đúng số tiền <strong>{{{ money(order.price) }}}</strong>.</div></div>
    <div class="actions">
      <button class="btn btn-primary btn-lg btn-block" onclick="Buyer.a02Claim('{{ order.id }}')">{{{ icon('check', 18) }}} Tôi đã chuyển khoản</button>
      <button class="btn btn-ghost" onclick="App.navigate('A-02')">{{{ icon('arrow-left', 16) }}} Chọn phương thức khác</button>
    </div>
  </div>
</div>
